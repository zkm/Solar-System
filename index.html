<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#08090a">
    <meta name="description" content="An interactive solar system built with CSS 3D transforms.">
    <title>CSS Solar System</title>
    <link rel="icon" href="/favicon.ico">
    <script type="module" src="/src/main.js"></script>
  </head>

  <body class="view-3D zoom-large data-close controls-close">
    <header id="navbar">
      <button
        type="button"
        id="toggle-data"
        class="panel-toggle"
        aria-controls="data"
        aria-expanded="false"
      >
        Planets
      </button>
      <h1>Solar System</h1>
      <button
        type="button"
        id="toggle-controls"
        class="panel-toggle"
        aria-controls="controls"
        aria-expanded="false"
      >
        Controls
      </button>
    </header>

    <nav id="data" aria-label="Planets">
      <ul></ul>
    </nav>

    <form id="controls" aria-label="View controls">
      <label class="switch">
        <span>3D view</span>
        <input type="checkbox" name="view" checked>
        <span class="track" aria-hidden="true"></span>
      </label>
      <label class="switch">
        <span>Close-up</span>
        <input type="checkbox" name="zoom">
        <span class="track" aria-hidden="true"></span>
      </label>
      <label class="switch">
        <span>Motion</span>
        <input type="checkbox" name="motion" checked>
        <span class="track" aria-hidden="true"></span>
      </label>
      <fieldset>
        <legend>Scale</legend>
        <div class="segmented">
          <label><input type="radio" name="scale" value="speed" checked><span>Speed</span></label>
          <label><input type="radio" name="scale" value="size"><span>Size</span></label>
          <label><input type="radio" name="scale" value="distance"><span>Distance</span></label>
        </div>
      </fieldset>
    </form>

    <main id="universe" class="scale-stretched">
      <div id="sky" aria-hidden="true"></div>
      <div id="galaxy">
        <div id="solar-system" data-focus="earth">
          <div id="mercury" class="orbit">
            <div class="pos">
              <div class="planet"></div>
            </div>
          </div>
          <div id="venus" class="orbit">
            <div class="pos">
              <div class="planet"></div>
            </div>
          </div>
          <div id="earth" class="orbit">
            <div class="pos">
              <div class="orbit">
                <div class="pos">
                  <div class="moon"></div>
                </div>
              </div>
              <div class="planet"></div>
            </div>
          </div>
          <div id="mars" class="orbit">
            <div class="pos">
              <div class="planet"></div>
            </div>
          </div>
          <div id="jupiter" class="orbit">
            <div class="pos">
              <div class="planet"></div>
            </div>
          </div>
          <div id="saturn" class="orbit">
            <div class="pos">
              <div class="planet">
                <div class="ring"></div>
              </div>
            </div>
          </div>
          <div id="uranus" class="orbit">
            <div class="pos">
              <div class="planet"></div>
            </div>
          </div>
          <div id="neptune" class="orbit">
            <div class="pos">
              <div class="planet"></div>
            </div>
          </div>
          <div id="sun"></div>
        </div>
      </div>
    </main>
  </body>
</html>
